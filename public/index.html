<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trend Story Maker</title>
<style>
:root{--bg:#7b2cbf;--ink:#1d0b3a;--card:#fffdf5;--hi:#b5e61d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,sans-serif;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:18px 14px 50px}
h1{font-size:2.1rem;margin:6px 0}
.card{background:var(--card);color:var(--ink);border:3px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--hi);padding:14px;margin-bottom:16px}
label{display:block;font-weight:800;margin:10px 0 4px}
textarea,select,input{width:100%;font:inherit;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:10px;padding:10px}
textarea{min-height:110px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;font-weight:800;cursor:pointer;color:var(--ink);background:var(--hi);border:3px solid var(--ink);border-radius:12px;padding:10px 14px;margin:8px 8px 0 0}
button.big{width:100%;font-size:1.1rem;margin-right:0;padding:13px}
button.alt{background:#fff;font-size:.85rem;padding:6px 10px}
button:disabled{opacity:.6;cursor:wait}
.sc{border-top:2px dashed var(--ink);margin-top:12px;padding-top:10px}
.sc img{width:70px;border-radius:6px;float:right;margin-left:8px}
.sc textarea{min-height:70px;font-size:.85rem}
.k{font-size:.78rem;font-weight:800;text-transform:uppercase;opacity:.7;margin:6px 0 2px}
#msg,#vmsg{font-weight:800;min-height:1.3em;margin:10px 0 0}
</style></head><body><main>
<h1>Trend Story Maker</h1>
<section class="card">
<label for="idea">Ton idée</label>
<textarea id="idea" placeholder="Ex : un raisin géant défie une pomme verte dans la cantine, tout le monde filme, la pomme gagne à la fin…"></textarea>
<div class="row">
<div><label for="dur">Durée</label><select id="dur"><option value="12">1 minute (12 scènes)</option><option value="6">30 secondes (6 scènes)</option></select></div>
<div><label for="style">Style</label><select id="style"><option>Pixar semi-realistic 3D</option><option>Cinematic realistic</option><option>Anime</option><option>Colorful 3D cartoon</option></select></div>
</div>
<button class="big" id="go" type="button">1. Écrire le scénario</button>
<label for="paste">Ou colle un scénario JSON (fait avec Claude)</label>
<textarea id="paste" style="min-height:60px"></textarea>
<button class="alt" id="use" type="button">Utiliser ce scénario</button>
<p id="msg" role="status"></p>
</section>
<section class="card" id="sec" hidden>
<h2 id="ttl" style="margin:0 0 4px"></h2>
<div id="list"></div>
<button class="big" id="make" type="button">2. Créer les images et la vidéo</button>
<p id="vmsg" role="status">Compte 20 secondes par image. Reste sur la page.</p>
<video id="vid" controls playsinline hidden style="width:100%;margin-top:10px;border-radius:12px"></video>
<a id="vdl" download="histoire.webm" hidden><button class="alt" type="button">Télécharger la vidéo</button></a>
<p style="font-size:.85rem">Pour de vrais mouvements, dépose les images dans Dreamina ou Creen AI, puis monte dans CapCut.</p>
</section>
</main>
<script>
var $=function(i){return document.getElementById(i)},SC=null,IMG=[];
function wait(ms){return new Promise(function(ok){setTimeout(ok,ms)})}
function show(o){
SC=o;IMG=[];$("ttl").textContent=o.titre||"Mon histoire";$("list").innerHTML="";
o.scenes.forEach(function(s,i){
var d=document.createElement("div");d.className="sc";d.id="sc"+i;
d.innerHTML='<b>Scène '+(i+1)+'</b><div class="k">Réplique</div><input><div class="k">Prompt image</div><textarea></textarea>';
var inp=d.querySelector("input"),ta=d.querySelector("textarea");
inp.value=s.replique_fr||"";ta.value=s.image_en||"";
inp.oninput=function(){s.replique_fr=inp.value};ta.oninput=function(){s.image_en=ta.value};
$("list").appendChild(d)});
$("sec").hidden=false;$("sec").scrollIntoView({behavior:"smooth"})}
$("go").onclick=async function(){
var idea=$("idea").value.trim();if(!idea){$("msg").textContent="Écris ton idée.";return}
$("go").disabled=true;$("msg").textContent="Écriture du scénario… (jusqu’à 1 minute)";
try{var r=await fetch("/api/story?idea="+encodeURIComponent(idea)+"&n="+$("dur").value+"&style="+encodeURIComponent($("style").value));
var j=await r.json();if(!r.ok){$("msg").textContent=j.error||"Erreur.";return}
show(j);$("msg").textContent=""}
catch(e){$("msg").textContent="Erreur réseau."}finally{$("go").disabled=false}};
$("use").onclick=function(){
try{var o=JSON.parse($("paste").value);if(!o.scenes||!o.scenes.length)throw 0;show(o);$("msg").textContent=""}
catch(e){$("msg").textContent="JSON invalide. Copie-le avec « Copier en JSON » sur la page de Claude."}};
function thumb(i,u){var d=$("sc"+i),im=d.querySelector("img");if(!im){im=document.createElement("img");d.insertBefore(im,d.firstChild)}im.src=u}
async function images(){
var seed=Math.floor(Math.random()*1e6),m=$("vmsg");IMG=[];
for(var i=0;i<SC.scenes.length;i++){
m.textContent="Image "+(i+1)+"/"+SC.scenes.length+"… reste sur la page";
var blob=null;
for(var n=0;n<5&&!blob;n++){
var r=await fetch("/api/image?seed="+seed+"&prompt="+encodeURIComponent(SC.scenes[i].image_en));
if(r.ok)blob=await r.blob();else await wait(16000)}
if(!blob){m.textContent="Échec à l’image "+(i+1)+". Réessaie plus tard.";return false}
var u=URL.createObjectURL(blob);IMG.push(u);thumb(i,u)}
return true}
function wrap(x,t,w){var a=t.split(" "),l="",o=[];a.forEach(function(m){var n=l?l+" "+m:m;if(x.measureText(n).width>w&&l){o.push(l);l=m}else l=n});if(l)o.push(l);return o}
async function video(){
var m=$("vmsg");m.textContent="Préparation des voix…";
var AC=window.AudioContext||window.webkitAudioContext,ac=new AC();ac.resume();
var dest=ac.createMediaStreamDestination(),sc=[];
for(var k=0;k<SC.scenes.length;k++){
var s=SC.scenes[k],text=(s.replique_fr||"").trim();
var im=await new Promise(function(ok){var i=new Image();i.onload=function(){ok(i)};i.src=IMG[k]});
var buf=null;
if(text){try{var r=await fetch("/api/voice?text="+encodeURIComponent(text));if(r.ok)buf=await ac.decodeAudioData(await r.arrayBuffer())}catch(e){}}
sc.push({im:im,text:text,buf:buf,dur:buf?Math.max(5,buf.duration+0.6):5})}
var c=document.createElement("canvas");c.width=540;c.height=960;var x=c.getContext("2d");
var st=c.captureStream(30);dest.stream.getAudioTracks().forEach(function(t){st.addTrack(t)});
var mt=MediaRecorder.isTypeSupported("video/webm;codecs=vp9,opus")?"video/webm;codecs=vp9,opus":"video/webm";
var rec=new MediaRecorder(st,{mimeType:mt}),ch=[];
rec.ondataavailable=function(e){if(e.data.size)ch.push(e.data)};
rec.onstop=function(){var u=URL.createObjectURL(new Blob(ch,{type:"video/webm"}));$("vid").src=u;$("vid").hidden=false;$("vdl").href=u;$("vdl").hidden=false;m.textContent="Vidéo prête !";$("make").disabled=false;ac.close()};
m.textContent="Création de la vidéo… reste sur la page.";
var starts=[],tot=0;sc.forEach(function(s){starts.push(tot);tot+=s.dur*1000});
rec.start();var t0=performance.now();
sc.forEach(function(s,i){if(s.buf){var b=ac.createBufferSource();b.buffer=s.buf;b.connect(dest);b.start(ac.currentTime+starts[i]/1000+0.2)}});
(function f(now){
var t=now-t0;if(t>=tot){rec.stop();return}
var k=0;while(k<sc.length-1&&t>=starts[k+1])k++;
var s=sc[k],p=(t-starts[k])/(s.dur*1000),z=1.04+0.14*p,w=540*z,h=960*z;
var dx=s.buf?Math.sin(t/180)*3:0,dy=s.buf?Math.cos(t/210)*3:0;
x.fillStyle="#000";x.fillRect(0,0,540,960);
x.drawImage(s.im,(540-w)/2+dx,(960-h)/2+dy,w,h);
if(s.text){x.font="bold 34px sans-serif";x.textAlign="center";var L=wrap(x,s.text,480);
L.forEach(function(l,j){var y=820-(L.length-1-j)*42;x.lineWidth=8;x.strokeStyle="#000";x.strokeText(l,270,y);x.fillStyle="#fff";x.fillText(l,270,y)})}
requestAnimationFrame(f)})(t0)}
$("make").onclick=async function(){
if(!SC)return;$("make").disabled=true;$("vid").hidden=true;$("vdl").hidden=true;
var ok=await images();if(!ok){$("make").disabled=false;return}
try{await video()}catch(e){$("vmsg").textContent="Erreur pendant la vidéo.";$("make").disabled=false}};
</script></body></html>
